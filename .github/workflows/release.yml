name: release

# Builds the portable, self-contained single-file exe on a Windows runner and
# publishes it as a GitHub Release. Free on GitHub-hosted runners for public repos.
# Triggered by pushing a v* tag, or manually via the Actions "Run workflow" button.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write   # needed to create the release and upload the exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Untrusted inputs (workflow_dispatch input, ref name) are bound to env vars
      # instead of interpolated into the script, so the shell treats them as data,
      # never code. The format check is a second line of defence.
      - name: Resolve version
        id: ver
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build GamePriorityManager.sln -c Release

      - name: Test
        run: dotnet test tests/GPM.Core.Tests -c Release --no-build

      # Matches docs/release.md exactly: self-contained WPF, single-file, native
      # libs bundled for self-extract (no trimming/AOT support for WPF).
      - name: Publish portable exe
        run: >
          dotnet publish src/GPM.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o out/release

      - name: Package and hash
        id: pkg
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mv out/release/GPM.App.exe "out/release/GPM-$VERSION.exe"
          SHA=$(sha256sum "out/release/GPM-$VERSION.exe" | cut -d' ' -f1)
          SIZE=$(( $(stat -c%s "out/release/GPM-$VERSION.exe") / 1024 / 1024 ))
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=${SIZE} MB" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: GPM ${{ steps.ver.outputs.version }}
          files: out/release/GPM-${{ steps.ver.outputs.version }}.exe
          body: |
            **GPM — Game Priority Manager** ${{ steps.ver.outputs.version }}

            Portable, self-contained Windows build. Download `GPM-${{ steps.ver.outputs.version }}.exe` and run it — no install, no .NET runtime required.

            | | |
            |---|---|
            | Size | ${{ steps.pkg.outputs.size }} |
            | SHA256 | `${{ steps.pkg.outputs.sha }}` |

            **Note:** the exe is unsigned, so SmartScreen/antivirus may warn on first
            run. Exactly what GPM writes to the registry: [Safety notes](https://github.com/${{ github.repository }}/blob/${{ steps.ver.outputs.version }}/README.md#safety-notes).
